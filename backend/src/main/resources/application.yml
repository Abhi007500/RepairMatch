server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: repairmatch-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/repairmatch}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.postgresql.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:${USER:postgres}}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  otp:
    expiration-minutes: ${OTP_EXPIRATION_MINUTES:5}
    cooldown-seconds: ${OTP_COOLDOWN_SECONDS:60}
    max-attempts: ${OTP_MAX_ATTEMPTS:5}
    allow-demo-fallback: ${OTP_ALLOW_DEMO_FALLBACK:true}
  sms:
    provider: ${SMS_PROVIDER:dev} # dev, twilio, fast2sms
    api-key: ${SMS_API_KEY:}
    api-secret: ${SMS_API_SECRET:}
    sender-id: ${SMS_SENDER_ID:RepairMatch}
  payment:
    provider: ${PAYMENT_PROVIDER:razorpay} # razorpay, mock
    razorpay:
      key-id: ${RAZORPAY_KEY_ID:rzp_test_mockKey123456}
      key-secret: ${RAZORPAY_KEY_SECRET:mockSecretKey987654}
      currency: ${RAZORPAY_CURRENCY:INR}

management:
  endpoints:
    web:
      exposure:
        include: health,info
